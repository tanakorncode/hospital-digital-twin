name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # node:sqlite (API storage) needs Node 22.13+
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check (web + API)
        run: pnpm typecheck
      - name: Tests (web + API)
        run: pnpm test
